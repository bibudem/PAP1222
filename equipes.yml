# ─────────────────────────────────────────────────────────────────────────
# LISTE DES ÉQUIPES — source unique de vérité
#
# Vous seul modifiez ce fichier. Les étudiants n'y touchent jamais.
# Rempli une fois en début de session, il alimente automatiquement :
#
#   • la page titre de chaque PDF (titre, cours, auteurs, date, licence)
#   • le nom de chaque fichier produit
#   • les avertissements de cohérence dans les pull requests
#
# Résultat : vos étudiants n'écrivent aucune métadonnée. Ils rédigent, c'est tout.
# ─────────────────────────────────────────────────────────────────────────

titre: "Stratégie de recherche"
cours: "PAP1222 — Savoirs scientifiques en pharmacie"
etablissement: "Université de Montréal"
session: "Automne 2026"
licence: "Creative Commons Attribution 4.0 International (CC BY 4.0)"
licence_url: "https://creativecommons.org/licenses/by/4.0/deed.fr"

# Ces deux lignes composent la mention portée sur la page titre de chaque PDF.
# C'est le seul endroit où la licence est visible : la notice de Papyrus n'a
# pas de champ prévu pour elle.


# ─── Qui signe la page titre ─────────────────────────────────────────────
#
#   membres  → les noms inscrits sous « equipes » ci-dessous. C'est le
#              réglage retenu : ces documents sont publiés, cités et
#              déposés dans Papyrus. Ce sont des travaux signés.
#   equipe   → « Équipe 01 ». Réservé aux cas où une équipe refuse la
#              publication sous son nom.
#
# Une signature « Équipe 01 » n'est pas professionnelle, et sous licence
# CC BY elle ne donne à personne à créditer. L'attribution est la condition
# de la licence : sans nom, elle ne veut rien dire.
#
# ⚠ CE QUI SUIT N'EST PAS RÉVERSIBLE. Le repository est public et
#   l'historique Git est définitif : un nom inscrit ici y reste pour
#   toujours, même si la ligne est retirée plus tard, même si l'équipe
#   renonce au dépôt, même si un étudiant quitte le cours.
#
#   Deux choses à faire AVANT d'inscrire le premier nom :
#
#   1. Obtenir le consentement écrit de chaque étudiant à la publication de
#      son travail sous son nom, avec licence CC BY. Ce n'est plus une
#      formalité : c'est ce qui rend la suite légitime.
#   2. Prévoir une voie de remise non publique pour qui refuse — et laisser
#      son équipe en « auteurs: equipe » si le refus est individuel dans une
#      équipe qui accepte.
#
# ─────────────────────────────────────────────────────────────────────────
auteurs: membres


# ─── Les équipes ─────────────────────────────────────────────────────────
#
# Chaque équipe reçoit ses « membres ». Une équipe laissée vide signera
# « Équipe NN » et le workflow vous le signalera par un avertissement.
#
#   equipe-01:
#     membres:
#       - Tremblay, Léa
#       - Nguyen, Minh
#       - Samuel Côté
#
#   equipe-02:
#     titre: "Antibioprophylaxie en chirurgie orthopédique"
#     membres:
#       - …
#
# « titre » remplace le titre général sur la page titre de cette équipe.
# Renseignez-le pour les travaux destinés à Papyrus, où chaque notice a besoin
# d'un titre distinct. Laissé vide, le titre général s'applique.
#
# Deux conventions de nom fonctionnent, même mélangées :
#   - Tremblay, Léa   → nom de famille = ce qui précède la virgule
#   - Léa Tremblay    → nom de famille = le dernier mot
#
# L'ordre des noms est celui que vous écrivez : il détermine l'ordre des
# auteurs sur la page titre et dans le nom du fichier PDF.

equipes:

