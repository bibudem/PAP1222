# .github/workflows/deployer-gabarit.yml
#
# Crée les dossiers d'équipe déclarés dans equipes.yml, puis y copie
# .github/gabarit/strategie_recherche.md — le tout en une seule pull request.
#
# La liste des équipes est lue dans equipes.yml, jamais sur le disque. C'est
# ce qui permet de repartir de zéro : Git ne versionne pas les dossiers vides,
# donc un dossier supprimé ne revient pas tout seul. Ce workflow le recrée.
#
# À lancer : onglet Actions → « Déployer le gabarit » → Run workflow.
#
# Le workflow n'écrit jamais dans main. Il ouvre une pull request que
# l'administrateur relit et fusionne — le ruleset reste intact, et rien
# n'échappe à la révision.
#
# ⚠ Cette pull request n'a pas de contrôle « verification » : GitHub ne
#   déclenche aucun workflow pour un événement produit par le GITHUB_TOKEN.
#   Le contrôle exigé reste en attente ; la fusion se fait en contournant la
#   règle, par un compte autorisé à le faire.
#
#   ecraser: false  → n'installe le gabarit que dans les dossiers vides.
#                     Sans danger en cours de session.
#   ecraser: true   → remplace tous les fichiers. C'est ce qu'il faut pour
#                     mettre à jour le gabarit, ou pour repartir à neuf au
#                     début d'une session. ⚠ Écrase le travail des équipes :
#                     vérifier l'onglet Files changed avant de fusionner.

name: Déployer le gabarit

on:
  workflow_dispatch:
    inputs:
      ecraser:
        description: "Remplacer les fichiers qui existent déjà (écrase le travail en cours)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Copier le gabarit
        id: copie
        run: |
          set -uo pipefail
          shopt -s nullglob

          gabarit=.github/gabarit/strategie_recherche.md
          if [ ! -f "$gabarit" ]; then
            echo "::error::$gabarit est introuvable."
            exit 1
          fi

          # La liste des équipes vient de equipes.yml, pas du disque : c'est la
          # source unique de vérité, et Git ne versionne pas les dossiers
          # vides. Les dossiers manquants sont donc créés au besoin.
          if [ ! -f equipes.yml ]; then
            echo "::error::equipes.yml est introuvable."
            exit 1
          fi

          mapfile -t equipes < <(sed -n 's/^  \(equipe-[A-Za-z0-9_-]*\):.*$/\1/p' equipes.yml)
          if [ ${#equipes[@]} -eq 0 ]; then
            echo "::error::Aucune équipe déclarée dans equipes.yml. Le fichier doit contenir des lignes « equipe-01: » indentées de deux espaces."
            exit 1
          fi
          echo "${#equipes[@]} équipe(s) déclarée(s) dans equipes.yml."
          echo

          poses=0
          ignores=0
          crees=0
          for e in "${equipes[@]}"; do
            if [ ! -d "equipes/$e" ]; then
              mkdir -p "equipes/$e"
              echo "+ dossier créé : equipes/$e"
              crees=$((crees+1))
            fi
            cible="equipes/$e/strategie_recherche.md"
            if [ -f "$cible" ] && [ "${{ inputs.ecraser }}" != "true" ]; then
              echo "· ignoré (existe déjà) : $cible"
              ignores=$((ignores+1))
              continue
            fi
            cp "$gabarit" "$cible"
            echo "→ $cible"
            poses=$((poses+1))
          done

          echo
          echo "$crees dossier(s) créé(s), $poses fichier(s) déposé(s), $ignores ignoré(s)."
          echo "poses=$poses" >> "$GITHUB_OUTPUT"

      - name: Ouvrir la pull request
        if: steps.copie.outputs.poses != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # « git add » AVANT le test. « git diff » seul compare l'arbre de
          # travail à l'index : les fichiers non suivis n'y figurent pas, et
          # des dossiers d'équipe fraîchement créés sont tous non suivis.
          # Le test passait donc pour « rien à soumettre », l'exécution
          # finissait en vert, et aucune pull request n'était créée.
          git add -A equipes/

          if git diff --cached --quiet -- equipes/; then
            echo "Rien à soumettre : les fichiers sont identiques à ceux du repository."
            exit 0
          fi

          echo "$(git diff --cached --name-only -- equipes/ | wc -l) fichier(s) à soumettre."

          branche="deploiement-gabarit-$(date +%Y%m%d-%H%M)"
          git checkout -b "$branche"
          git commit -m "Déploiement du gabarit dans les dossiers d'équipe"
          git push -u origin "$branche"

          # Le corps passe par un fichier : une ligne non indentée dans un
          # bloc « run: | » le terminerait, et GitHub lirait la suite comme
          # des clés YAML de premier niveau.
          printf '%s\n' \
            'Générée par le workflow **Déployer le gabarit**.' \
            '' \
            'Source : `.github/gabarit/strategie_recherche.md`' \
            'Mode `ecraser` : `${{ inputs.ecraser }}`' \
            '' \
            'Vérifier l'"'"'onglet **Files changed** avant de fusionner.' \
            '' \
            'En mode `ecraser: true`, cette pull request remplace le contenu des fichiers d'"'"'équipe — donc leur travail.' \
            > corps-pr.md

          gh pr create \
            --title "Déploiement du gabarit dans les dossiers d'équipe" \
            --body-file corps-pr.md

          rm -f corps-pr.md
          echo "Pull request ouverte sur la branche $branche."
